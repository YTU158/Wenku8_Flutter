name: Build Custom Book Source APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Ensure Android minSdk >= 21 (required by flutter_js)
        run: |
          F="android/app/build.gradle.kts"
          echo "--- current minSdk ---"
          grep -n "minSdk" "$F" || true
          # If minSdk is below 21, raise it. Handles both `minSdk = X` and `minSdkVersion(X)`.
          python3 - <<'PY'
          import re
          p = "android/app/build.gradle.kts"
          s = open(p, encoding="utf-8").read()
          def fix(m):
              return m.group(1) + "21"
          if "minSdkVersion" in s:
              s2 = re.sub(r'(minSdkVersion\()\d+', fix, s)
          else:
              s2 = re.sub(r'(minSdk\s*=\s*)\d+', fix, s)
              if "minSdk" not in s2:
                  s2 = s2.replace("defaultConfig {", "defaultConfig {\n        minSdk = 21")
          open(p, "w", encoding="utf-8").write(s2)
          print("--- patched minSdk ---")
          print("\n".join(l for l in s2.splitlines() if "minSdk" in l))
          PY

      - name: Ensure INTERNET permission
        run: |
          M="android/app/src/main/AndroidManifest.xml"
          grep -q 'android.permission.INTERNET' "$M" || \
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET" />' "$M"
          grep -n "INTERNET" "$M" || true

      - name: flutter pub get
        run: flutter pub get

      - name: Analyze (non-blocking report)
        continue-on-error: true
        run: flutter analyze || true

      - name: Build ARM64 APK (debug signing, installable)
        run: flutter build apk --debug --target-platform android-arm64

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk artifacts/wenku8-custom-arm64.apk
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: wenku8-custom-arm64
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
